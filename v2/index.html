<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Camerino</title>
<link rel="icon" href="../img/icona-192.png">
<link rel="apple-touch-icon" href="../img/icona-180.png">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://cdn.shopify.com">
<style>
@font-face { font-family: "Courier Prime"; font-weight: 400; font-display: swap; src: url(../font/courier-prime-400.woff2) format("woff2"); }
@font-face { font-family: "Courier Prime"; font-weight: 700; font-display: swap; src: url(../font/courier-prime-700.woff2) format("woff2"); }
@font-face { font-family: "Cutive Mono"; font-weight: 400; font-display: swap; src: url(../font/cutive-mono-400.woff2) format("woff2"); }
/* Stile del mockup approvato il 9–12/10: bianco, carattere da macchina da scrivere, solo tema chiaro. */
:root {
  --carta: #ffffff; --tavolo: #f1f1ee; --ink: #111111; --ink-2: #55554f; --ink-3: #9a9a93; --riga: #e6e6e1; --velo: #f6f6f4;
  --rosso: #a33a1a; --verde: #2f5a3a;
  --testo: "Courier Prime", "Courier New", Courier, ui-monospace, monospace;
  --titolo: "Cutive Mono", "Courier Prime", "Courier New", monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--tavolo); color: var(--ink); font: 15px/1.45 var(--testo); }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.app { position: relative; height: 100%; max-width: 430px; margin: 0 auto; background: var(--carta); display: flex; flex-direction: column; overflow: hidden; }
.schermo { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.lati { padding-inline: max(20px, env(safe-area-inset-left, 0px)) max(20px, env(safe-area-inset-right, 0px)); }

/* ---------- pulsanti ---------- */
.pieno, .vuoto { height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; font-size: 15px; text-decoration: none; border: 1px solid var(--ink); }
.pieno { background: var(--ink); color: var(--carta); }
.pieno[disabled] { background: var(--riga); border-color: var(--riga); color: var(--ink-3); cursor: not-allowed; }
.piccolo { height: 34px; padding: 0 10px; border: 1px solid var(--riga); font-size: 12px; white-space: nowrap; }
.piccolo[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--carta); }
.icona { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--riga); }
.icona svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.5; }
.testo-link { text-decoration: underline; text-underline-offset: 3px; font-size: 13px; color: var(--ink-2); }

/* ---------- profilo (4 passi) ---------- */
.passo { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; padding-block: 18px 0; }
.dove { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); display: flex; justify-content: space-between; align-items: center; min-height: 24px; }
.passo h1 { font: 400 30px/1.1 var(--titolo); margin: 14px 0 8px; text-wrap: balance; }
.passo .sotto { margin: 0 0 18px; color: var(--ink-2); font-size: 14px; }
.campo { display: grid; gap: 10px; padding: 16px 0; border-top: 1px solid var(--riga); }
.etichetta { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); display: flex; justify-content: space-between; align-items: baseline; }
.etichetta output { color: var(--ink); font-weight: 700; letter-spacing: 0; text-transform: none; font-size: 16px; }
.scelte { display: flex; gap: 6px; flex-wrap: wrap; }
.scelte button { min-width: 46px; height: 40px; padding: 0 10px; border: 1px solid var(--riga); font-size: 14px; }
.scelte button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--carta); }
.grandi { display: grid; gap: 10px; margin-top: 8px; }
.grandi button { height: 76px; border: 1px solid var(--ink); font: 400 22px var(--titolo); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
.grandi button[aria-pressed="true"] { background: var(--ink); color: var(--carta); }
input[type=range] { width: 100%; accent-color: var(--ink); }
.stagione { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid var(--riga); text-align: left; width: 100%; }
.stagione small { display: block; font-size: 11px; color: var(--ink-2); }
.stagione[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.pallini { display: flex; gap: 4px; justify-content: flex-end; flex-wrap: wrap; }
.pallini i { width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(0,0,0,.12); }
.stagioni { display: grid; gap: 8px; }
.esito { font-size: 13px; padding: 10px 12px; border: 1px solid var(--ink); }
.interruttore { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; }
.interruttore input { width: 20px; height: 20px; accent-color: var(--ink); }
.piede { position: sticky; bottom: 0; background: var(--carta); padding-block: 14px max(14px, env(safe-area-inset-bottom, 0px)); margin-top: auto; display: grid; gap: 10px; }
.piede .pieno { width: 100%; justify-content: space-between; }

/* ---------- camerino: l'avatar a tutto schermo ---------- */
.testa { flex: none; display: flex; align-items: center; justify-content: space-between; padding-block: 10px 6px; }
.logo { font: 400 23px var(--titolo); }
.budget { flex: none; padding-bottom: 8px; }
.budget .cifre { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--ink-2); }
.budget .cifre b { font-size: 16px; color: var(--ink); }
.budget .barra { height: 3px; background: var(--riga); margin-top: 5px; }
.budget .barra i { display: block; height: 100%; background: var(--ink); max-width: 100%; transition: width .25s; }
.budget.sfora .barra i { background: var(--rosso); }
.budget.sfora .resto { color: var(--rosso); }
.palco { flex: 1; min-height: 0; position: relative; overflow: hidden; background: var(--carta); touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; }
.palco.gira { cursor: grabbing; }
.palco .avatar { position: absolute; inset: 0 0 18px 0; width: 100%; height: calc(100% - 18px); object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
.palco .avatar.specchio { transform: scaleX(-1); }
.punti { position: absolute; left: 0; right: 0; bottom: 4px; display: flex; gap: 5px; justify-content: center; }
.punti i { width: 5px; height: 5px; border-radius: 50%; background: var(--riga); }
.punti i.ora { background: var(--ink); }
.pillola { position: absolute; left: max(20px, env(safe-area-inset-left, 0px)); top: 6px; font-size: 11px; color: var(--ink-2); background: var(--carta); border: 1px solid var(--riga); padding: 4px 8px; }
.colonna { position: absolute; right: max(14px, env(safe-area-inset-right, 0px)); top: 6px; bottom: 26px; display: flex; flex-direction: column; gap: 6px; justify-content: center; }
.casella { position: relative; width: 62px; height: 78px; border: 1px solid var(--riga); background: var(--velo); overflow: hidden; }
.casella img { width: 100%; height: 100%; object-fit: cover; object-position: center top; pointer-events: none; }
.casella.scarpe img { object-fit: contain; object-position: center; }
.casella small { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.92); font-size: 8.5px; letter-spacing: .08em; text-transform: uppercase; text-align: center; padding: 2px 0; }
.casella.libera { border-style: dashed; border-color: var(--ink-3); display: grid; place-items: center; font-size: 22px; color: var(--ink-3); background: var(--carta); }
.casella .lucchetto { position: absolute; top: 3px; right: 3px; width: 16px; height: 16px; background: var(--ink); color: var(--carta); display: grid; place-items: center; }
.casella .lucchetto svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 2; }
.attrezzi { position: absolute; left: max(20px, env(safe-area-inset-left, 0px)); bottom: 26px; display: grid; gap: 6px; }
.attrezzi .icona { background: var(--carta); }
.attrezzi .icona[aria-pressed="true"] svg { fill: currentColor; }
.avviso { flex: none; margin: 0; padding: 8px 0 0; font-size: 13px; }
.azioni { flex: none; display: grid; grid-template-columns: 1fr 1.35fr; gap: 6px; padding-block: 8px; }
.azioni .pieno, .azioni .vuoto { font-size: 14px; white-space: nowrap; padding: 0 8px; }
.schede { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--ink); padding-bottom: env(safe-area-inset-bottom, 0px); }
.schede button { height: 50px; font-size: 13px; color: var(--ink-3); }
.schede button[aria-current="page"] { color: var(--ink); font-weight: 700; }
.corpo { flex: 1; min-height: 0; overflow-y: auto; }
.tavola { position: absolute; inset: 0; display: grid; grid-template-columns: 1.15fr 1fr; gap: 2px; background: var(--carta); }
.tavola .destra { display: grid; gap: 2px; min-height: 0; }
.tessera { position: relative; min-height: 0; overflow: hidden; background: var(--velo); width: 100%; height: 100%; text-align: left; }
.tessera img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top; }
.tessera.scarpe img { object-fit: contain; object-position: center; }
.tessera span { position: absolute; left: 6px; bottom: 6px; background: var(--carta); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 6px; }
.riquadro { position: relative; height: min(46vh, 400px); background: var(--velo); border: 1px solid var(--riga); }
.riquadro .solo-testo { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ink-2); font-size: 14px; }
.posti { margin-top: 6px; }
.posto { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--riga); }
.posto .mini { width: 48px; height: 60px; background: var(--velo); border: 1px solid var(--riga); overflow: hidden; }
.posto .mini img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
.posto .chi { min-width: 0; text-align: left; }
.posto .nome-posto { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.posto .titolo { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.posto .riga2 { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tono { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 1px solid rgba(0,0,0,.18); margin-right: 3px; }
.bene { color: var(--verde); } .male { color: var(--rosso); }
.fondo { flex: none; padding-block: 10px max(10px, env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--ink); }
.note { font-size: 11px; color: var(--ink-3); margin: 10px 0 14px; }
.tre { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tre .piccolo { height: 40px; font-size: 13px; }

/* ---------- foglio (scheda, cambia, compra, cerca, salvati) ---------- */
.foglio { position: absolute; inset: 0; background: var(--carta); z-index: 20; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .28s ease; visibility: hidden; }
.foglio.aperto { transform: none; visibility: visible; }
.foglio-testa { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px 8px; }
.foglio-testa h2 { font: 400 20px var(--titolo); margin: 0; }
.foglio-corpo { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: max(18px, env(safe-area-inset-bottom, 0px)); }
.filtri { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.filtri::-webkit-scrollbar { display: none; }
.griglia { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 10px; align-content: start; }
.carta { text-align: left; display: grid; gap: 3px; align-content: start; }
.carta img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; object-position: center top; background: var(--velo); border: 1px solid var(--riga); }
.carta .marca { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.carta b { font-size: 13px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.carta small { font-size: 11px; color: var(--ink-2); }
.altri { grid-column: 1 / -1; }
.niente { grid-column: 1 / -1; color: var(--ink-2); padding: 18px 0; font-size: 14px; }
.conta { font-size: 12px; color: var(--ink-2); padding-bottom: 8px; }
.cerca { display: flex; border: 1px solid var(--ink); margin-bottom: 8px; }
.cerca input { flex: 1; min-width: 0; border: 0; padding: 0 12px; height: 46px; background: none; font-size: 16px; }
.cerca input:focus { outline: none; }
.cerca button { width: 50px; border-left: 1px solid var(--ink); display: grid; place-items: center; }
.foto { position: relative; aspect-ratio: 3 / 4; max-height: 50vh; width: 100%; background: var(--velo); border: 1px solid var(--riga); }
.foto img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.dettagli { display: grid; gap: 4px; padding: 12px 0; }
.dettagli .marca { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.dettagli h3 { margin: 0; font-size: 17px; line-height: 1.25; }
.dettagli .riga { font-size: 13px; color: var(--ink-2); }
.vivo { border-top: 1px solid var(--ink); padding: 12px 0; display: grid; gap: 8px; }
.taglie-vive { display: flex; gap: 5px; flex-wrap: wrap; font-size: 13px; }
.taglie-vive span { min-width: 40px; height: 32px; padding: 0 6px; display: grid; place-items: center; border: 1px solid var(--riga); font-size: 12px; }
.taglie-vive span.si { border-color: var(--ink); }
.taglie-vive span.no { color: var(--ink-3); text-decoration: line-through; }
.taglie-vive span.mia { box-shadow: inset 0 0 0 1px var(--ink); font-weight: 700; }
.acquisto { display: grid; grid-template-columns: 56px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--riga); }
.acquisto img { width: 56px; height: 72px; object-fit: cover; object-position: center top; border: 1px solid var(--riga); }
.acquisto .stato { font-size: 12px; }
.acquisto .pieno { height: 40px; font-size: 13px; margin-top: 8px; }
.totale { display: flex; justify-content: space-between; padding: 14px 0 4px; font-weight: 700; }
.salvato { padding: 12px 0; border-bottom: 1px solid var(--riga); display: grid; gap: 8px; }
.salvato .strip { display: flex; gap: 4px; }
.salvato .strip img { width: 54px; height: 70px; object-fit: cover; object-position: center top; border: 1px solid var(--riga); }
.salvato .sotto-strip { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }

.toast { position: absolute; left: 50%; bottom: 128px; transform: translate(-50%, 16px); background: var(--ink); color: var(--carta); font-size: 13px; padding: 9px 14px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 40; display: flex; gap: 14px; align-items: center; max-width: calc(100% - 32px); }
.toast.su { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { color: var(--carta); text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .foglio, .toast, .budget .barra i { transition: none; } }
</style>
</head>
<body>
<div class="app">

  <!-- profilo, 4 passi -->
  <section class="schermo" id="s-profilo" hidden>
    <div class="passo lati" id="passo"></div>
  </section>

  <!-- camerino: l'avatar a tutto schermo, i capi di fianco -->
  <section class="schermo" id="s-camerino" hidden>
    <header class="testa lati">
      <span class="logo">camerino</span>
      <button class="icona" id="apri-profilo" aria-label="Il mio account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
    </header>
    <div class="budget lati" id="budget"></div>
    <div class="palco" id="palco"></div>
    <p class="avviso lati" id="avviso" hidden></p>
    <div class="azioni lati">
      <button class="vuoto" id="altro">Nuovo look</button>
      <button class="pieno" id="principale">Compra</button>
    </div>
  </section>

  <!-- scopri: sfogliare e cercare i capi -->
  <section class="schermo" id="s-scopri" hidden>
    <header class="testa lati"><span class="logo">scopri</span></header>
    <div class="lati" style="flex:none">
      <form class="cerca" id="c-form"><input id="c-q" type="search" placeholder="cappotto nero sotto 300" autocomplete="off" aria-label="Cerca un capo"><button aria-label="Cerca"><svg viewBox="0 0 24 24" width="17" height="17" stroke="currentColor" fill="none" stroke-width="1.5"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg></button></form>
      <div class="filtri" id="c-filtri"></div>
      <div class="conta" id="c-conta"></div>
    </div>
    <div class="corpo lati"><div class="griglia" id="c-griglia" style="padding-bottom:16px"></div></div>
  </section>

  <nav class="schede" id="schede" hidden>
    <button data-s="camerino" aria-current="page">Camerino</button>
    <button data-s="scopri">Scopri</button>
    <button data-s="salvati">Salvati</button>
  </nav>

  <!-- look ricevuto da un link -->
  <section class="schermo" id="s-condiviso" hidden>
    <header class="testa lati"><span class="logo">camerino</span></header>
    <div class="corpo lati">
      <p class="dove" style="margin:0 0 8px">Un look per te</p>
      <div class="riquadro" id="cond-palco"></div>
      <div class="posti" id="cond-posti"></div>
      <div class="totale" id="cond-totale"></div>
      <p class="note" id="cond-nota"></p>
    </div>
    <div class="fondo lati"><button class="pieno" id="cond-prova" style="width:100%"></button></div>
  </section>

  <div class="foglio" id="foglio" aria-hidden="true">
    <div class="foglio-testa lati"><h2 id="foglio-titolo"></h2><button class="icona" id="foglio-chiudi" aria-label="Chiudi">✕</button></div>
    <div class="foglio-corpo lati" id="foglio-corpo"></div>
  </div>
  <div class="foglio" id="foglio2" aria-hidden="true" style="z-index:30">
    <div class="foglio-testa lati"><h2 id="foglio2-titolo"></h2><button class="icona" id="foglio2-chiudi" aria-label="Chiudi">✕</button></div>
    <div class="foglio-corpo lati" id="foglio2-corpo"></div>
  </div>

  <div class="toast" id="toast" role="status"></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
